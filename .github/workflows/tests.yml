# Tests de sonar : node (Linux), tests de la logique du mod. L'extension Windows / macOS et ses jobs sont retirés
# (0.7.0) : l'appli ne la charge plus.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions épinglées par empreinte de commit (et non par tag, qu'on peut déplacer).
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Tests de la logique du mod
        run: node --test mod/test/logique.test.mjs

