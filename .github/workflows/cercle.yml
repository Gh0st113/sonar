# Extension « cercle » : tests à chaque push et PR ; sur un tag vX.Y.Z, construit cercle.exe et l'ajoute à une
# release en BROUILLON. La signature (cercle.exe.sig) se fait hors de GitHub, avec la clé de l'utilisateur, avant de
# publier : sans elle, aucun cercle.exe installé n'accepte la mise à jour. Voir README, « Extension cercle (Windows) ».
name: cercle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Relancer à la main depuis l'onglet Actions (bouton « Run workflow », une fois le workflow sur main).
  workflow_dispatch:

# Actions épinglées par empreinte de commit (et non par tag, qu'on peut déplacer) : le job release a le droit d'écrire.
# Versions sous Node 24 ; système fixé (ubuntu-24.04) plutôt que « ubuntu-latest », qui change sans prévenir.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.7'
          # Pas de go.sum : cercle.exe n'a aucune dépendance, rien à mettre en cache.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Tests de l'extension (Node)
        run: node --test extension/test/
      - name: Tests de la logique du mod (Node)
        run: node --test sonar/test/logique.test.mjs
      - name: Tests de cercle.exe (Go)
        working-directory: extension
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
      # Un cercle.exe d'essai à chaque push et PR (onglet Actions > l'exécution > Artifacts), avant toute release.
      # Exe d'ESSAI, non signé, construit depuis n'importe quelle PR : pour soi seulement, jamais à distribuer.
      - name: Construire cercle.exe (essai)
        working-directory: extension
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-buildid= -o cercle.exe .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cercle-exe-essai
          path: extension/cercle.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.7'
          cache: false
      - name: Une clé publique est embarquée (sinon les mises à jour seraient désactivées pour toujours)
        run: test -s extension/cle-publique.txt
      - name: Le tag suit la version du manifeste
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} ≠ manifeste v$v"; exit 1; }
      # Build reproductible (même version de Go, -trimpath, sans buildid) : on peut le refaire chez soi et comparer
      # l'empreinte avant de signer.
      - name: Construire cercle.exe
        working-directory: extension
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-buildid= -o cercle.exe .
          sha256sum cercle.exe | tee cercle.exe.sha256
      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes "À signer avant de publier : cercle signer cercle.exe <fichier de clé>" \
            extension/cercle.exe extension/cercle.exe.sha256
