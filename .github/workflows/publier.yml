# Publier une release de sonar pour Windows, sans PC : Actions > publier > « Run workflow » (sur main), ou Claude qui le lance.
#   1. construire : tout windows.yml (tests Linux, sonar.exe reproductible, installeur, essai réel sous Windows) ;
#   2. publier    : dans l'environnement protégé « publication ». S'il exige une approbation (Settings > Environments
#                   > publication > Required reviewers), GitHub attend le clic « Approve » du mainteneur avant cette
#                   étape. Puis : version plus récente que la dernière release, signature de sonar-setup.exe avec la
#                   clé de l'environnement (secrets CERCLE_CLE et CERCLE_PHRASE, noms d'avant le renommage gardés), vérifiée avec la clé publique
#                   embarquée, et release vX.Y.Z (le tag est créé sur le commit construit).
# Voir PUBLIER.md.
name: publier

on:
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois.
concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  construire:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows.yml

  publier:
    needs: construire
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: publication
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.7'
          cache: false
      - name: Version à publier
        id: version
        run: |
          test -s windows/cle-publique.txt || { echo "::error::windows/cle-publique.txt est vide : aucune mise à jour ne serait acceptée."; exit 1; }
          v=$(node -p "require('./windows/manifest.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v existe déjà : montez « version » dans windows/manifest.json."; exit 1
          fi
          derniere=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$derniere" ] && [ "$(printf '%s\n%s\n' "${derniere#v}" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::v$v n'est pas plus récente que $derniere."; exit 1
          fi
          echo "Publication de v$v (dernière release : ${derniere:-aucune})" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-exe
          path: sortie
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-setup-essai
          path: sortie
      # « sonar signer » vérifie que le setup contient exactement le sonar.exe construit, que sa version est celle du
      # manifeste, et que la clé est celle de cle-publique.txt ; la clé privée n'existe que le temps de cette étape.
      - name: Signer sonar-setup.exe
        env:
          CERCLE_CLE: ${{ secrets.CERCLE_CLE }}
          CERCLE_PHRASE: ${{ secrets.CERCLE_PHRASE }}
        run: |
          test -n "$CERCLE_CLE" && test -n "$CERCLE_PHRASE" || { echo "::error::secrets CERCLE_CLE et CERCLE_PHRASE absents de l'environnement « publication »."; exit 1; }
          (cd windows && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sonar" .)
          umask 077
          cle="$RUNNER_TEMP/cle.json"
          printf '%s' "$CERCLE_CLE" > "$cle"
          trap 'rm -f "$cle"' EXIT
          "$RUNNER_TEMP/sonar" signer sortie/sonar-setup.exe "$cle" --exe sortie/sonar.exe
          test -s sortie/sonar-setup.exe.sig
      - name: Publier la release
        env:
          v: ${{ steps.version.outputs.v }}
        run: |
          cd sortie
          sha256sum sonar-setup.exe > sonar-setup.exe.sha256
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --generate-notes \
            sonar-setup.exe sonar-setup.exe.sig sonar-setup.exe.sha256 sonar.exe sonar.exe.sha256
          echo "Release v$v : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$v" | tee -a "$GITHUB_STEP_SUMMARY"
